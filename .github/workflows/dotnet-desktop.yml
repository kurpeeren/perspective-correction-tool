name: .NET Framework Desktop Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1
      with:
        nuget-version: '5.x'

    - name: Restore NuGet packages
      run: nuget restore PerspectiveCorrectionTool.sln

    - name: Build the solution
      run: msbuild PerspectiveCorrectionTool.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=AnyCPU
